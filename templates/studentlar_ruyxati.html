<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studentlar ro'yxati</title>
    <link rel="stylesheet" href="{% static 'css/ruyxat.css' %}">
</head>
<body class="dark-theme">
    <div id="bgFollower" class="bg-follower" style="background-image: radial-gradient(circle at 20% 30%, rgba(90,12,18,0.46) 0%, rgba(0,0,0,0.78) 40%), radial-gradient(circle at 80% 65%, rgba(45,8,10,0.15) 0%, rgba(0,0,0,0.6) 45%), linear-gradient(180deg, rgba(6,3,4,0.95), rgba(14,5,6,0.95)); background-size: cover; background-position: center; filter: brightness(0.7);"></div>
    <div id="bgSpot" class="bg-spot" style="left:50%;top:50%;"></div>
    <div class="table-wrap">
    <div class="table-toolbar">
        <div class="table-title">Studentlar ro'yxati</div>
        <div class="table-actions">
            <a href="{% url 'qushish' %}" class="add-btn">Yangi student qo'shish</a>
        </div>
    </div>
    <div class="table-container">
    <table>
    <thead>
        <tr>
            <th>Ism</th>
            <th>Familiya</th>
            <th>Email</th>
            <th>Yosh</th>
            <th>Amallar</th>
        </tr>
    </thead>
    <tbody>
        {% for student in studentlar %}
        <tr>
            <td>{{ student.name }}</td>
            <td>{{ student.surname }}</td>
            <td>{{ student.email }}</td>
            <td>{{ student.age }}</td>
            <td>
                <div class="action-buttons">
                    <a href="{% url 'tahrirlash' student.id %}" class="edit-btn">Tahrirlash</a>
                    <a href="{% url 'uchirish' student.id %}" class="delete-btn" onclick="return confirm('Rostdan {{student.name}}ni o\'chirmoqchmisiz?!')">O'chirish</a>
                </div>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td class="empty" colspan="5">Studentlar topilmadi.</td>
        </tr>
        {% endfor %}
    </tbody>
    </table>
    </div>
    </div>
        <script>
        (function(){
            const el = document.getElementById('bgFollower');
            if(!el) return;
            const spot = document.getElementById('bgSpot');
            let tx = window.innerWidth/2, ty = window.innerHeight/2, cx = tx, cy = ty;
            window.addEventListener('mousemove', e => {
                tx = e.clientX;
                ty = e.clientY;
            });
            function raf(){
                cx += (tx - cx) * 0.16;
                cy += (ty - cy) * 0.16;
                if(spot){
                    spot.style.left = cx + 'px';
                    spot.style.top = cy + 'px';
                }
                requestAnimationFrame(raf);
            }
            raf();
        })();
        </script>
</body>
</html>
